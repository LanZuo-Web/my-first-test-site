<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 50% -8%, #ffe4cc 0%, transparent 62%),
      linear-gradient(180deg, #fffaf4 0%, #f7f7fb 100%);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1f2430;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 20px 70px;
  }
  h1 {
    font-size: clamp(2.3rem, 6.6vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-align: center;
    background: linear-gradient(115deg, #ff6b35, #f7931e 52%, #ff3d71);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 14px;
    color: #8b93a7;
    font-size: .95rem;
    text-align: center;
    line-height: 1.75;
  }
  .box { width: 100%; max-width: 620px; margin-top: 30px; }
  textarea {
    width: 100%;
    min-height: 88px;
    padding: 16px 18px;
    font-size: 1rem;
    font-family: inherit;
    line-height: 1.65;
    color: #1f2430;
    background: #fff;
    border: 1.5px solid #ececf2;
    border-radius: 16px;
    resize: vertical;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
    box-shadow: 0 2px 12px rgba(31, 36, 48, .045);
  }
  textarea:focus {
    border-color: #ff8a4c;
    box-shadow: 0 0 0 4px rgba(255, 138, 76, .13);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font-size: .85rem; font-family: inherit; color: #5c6478;
    background: #fff; border: 1px solid #ececf2; border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: #ffb98f; color: #ff6b35; transform: translateY(-1px); }
  .row { display: flex; gap: 12px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  button.go {
    padding: 13px 30px;
    font-size: 1rem; font-family: inherit; font-weight: 600;
    color: #fff;
    background: linear-gradient(120deg, #ff6b35, #ff3d71);
    border: 0; border-radius: 12px; cursor: pointer;
    transition: transform .12s, opacity .18s;
  }
  button.go:hover { transform: translateY(-1px); }
  button.go:active { transform: translateY(1px); }
  button.go:disabled { opacity: .55; cursor: default; transform: none; }
  .tag { font-size: .82rem; color: #9aa1b2; }

  #out { width: 100%; max-width: 620px; margin-top: 30px; }
  .card {
    background: #fff;
    border: 1px solid #f0f0f5;
    border-radius: 16px;
    padding: 18px 22px 20px;
    margin-bottom: 14px;
    box-shadow: 0 12px 34px -20px rgba(31, 36, 48, .38);
    animation: in .3s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  .shop {
    font-size: .78rem; color: #ff8a4c; font-weight: 600;
    letter-spacing: .02em; margin-bottom: 6px;
  }
  .dish {
    font-size: 1.24rem; font-weight: 700;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .price { font-size: 1rem; color: #ff3d71; font-weight: 700; }
  .price span { font-size: .78rem; font-weight: 500; }
  .meta {
    font-size: .74rem; font-weight: 500; color: #8b93a7;
    background: #f5f6fa; padding: 2px 9px; border-radius: 999px;
    vertical-align: middle;
  }
  .why {
    margin-top: 10px;
    font-size: .9rem; color: #5c6478; line-height: 1.75;
  }
  .note {
    text-align: center; color: #b26a00; font-size: .86rem;
    background: #fff8e6; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px;
  }
  .empty {
    text-align: center; color: #8b93a7; font-size: .92rem; padding: 24px;
  }
  footer { margin-top: 50px; font-size: .8rem; color: #b6bccb; }
  footer a { color: #b6bccb; text-decoration: none; border-bottom: 1px dashed #d8dce6; }
</style>
</head>
<body>
  <h1>今天吃什么</h1>
  <p class="sub">说一句你想吃的，我告诉你去哪家、点哪道。</p>

  <div class="box">
    <textarea id="q" placeholder="比如：想吃面，不要辣，十块左右"></textarea>

    <div class="chips">
      <button class="chip" data-t="想吃面">想吃面</button>
      <button class="chip" data-t="想吃米饭">想吃米饭</button>
      <button class="chip" data-t="想吃粉">想吃粉</button>
      <button class="chip" data-t="不辣">不辣</button>
      <button class="chip" data-t="微辣">微辣</button>
      <button class="chip" data-t="想吃辣的">想吃辣的</button>
      <button class="chip" data-t="十块以内">十块以内</button>
      <button class="chip" data-t="随便">随便</button>
    </div>

    <div class="row">
      <button class="go" id="go">帮我选</button>
      <span class="tag">不满意就再点一次，每次都不一样</span>
    </div>
  </div>

  <div id="out"></div>

  <footer>这是我的第一个网页 · <a href="about.html">旧版本</a></footer>

<script>
/* ============================================================
   这个页面怎么工作的：
   1. 你输入一句话，页面把它发给后端
   2. 后端拿着「学校菜单 + 你的话」去问大模型
   3. 大模型从菜单里挑 3 个，页面画出来

   为什么 Key 不在这个文件里？
   因为这个文件的每一行，任何人按 F12 都能看到。
   Key 只能放在后端，那是别人看不见的地方。
   ============================================================ */

const BACKEND = 'https://parts-wyoming-satisfactory-tile.trycloudflare.com';

const $q = document.getElementById('q');
const $go = document.getElementById('go');
const $out = document.getElementById('out');

// 点标签 = 往输入框里加一句话，不覆盖你已经打的字
document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    const t = c.dataset.t;
    $q.value = $q.value.trim() ? $q.value.trim() + '，' + t : t;
    $q.focus();
  };
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

function render(picks, note) {
  if (!picks || !picks.length) {
    $out.innerHTML = '<div class="empty">没找到合适的，换个说法再试一次？</div>';
    return;
  }
  const noteHtml = note ? '<div class="note">' + esc(note) + '</div>' : '';
  $out.innerHTML = noteHtml + picks.map(p => {
    return '<div class="card">'
      + '<div class="shop">' + esc(p.shop || '') + '</div>'
      + '<div class="dish">' + esc(p.dish || '')
      + '<span class="price"><span>¥</span>' + esc(p.price == null ? '?' : p.price) + '</span>'
      + '<span class="meta">' + esc(p.spicy || '') + '</span>'
      + '</div>'
      + '<p class="why">' + esc(p.why || '') + '</p>'
      + '</div>';
  }).join('');
}

$go.onclick = async () => {
  const text = $q.value.trim();
  if (!text) { $q.focus(); return; }

  $go.disabled = true;
  $out.innerHTML = '<div class="empty">正在挑…</div>';
  $out.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch(BACKEND + '/api/pick', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data.picks, data.note);
  } catch (e) {
    render([], '');
    $out.innerHTML = '<div class="note">连不上后端（AI 在你电脑上，电脑关了或者隧道断了）。'
      + '等一会儿再点一次。</div>';
  } finally {
    $go.disabled = false;
  }
};

// Ctrl/Cmd + Enter 直接提交
$q.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $go.click();
});
</script>
</body>
</html>
