<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 50% -8%, #ffe4cc 0%, transparent 62%),
      linear-gradient(180deg, #fffaf4 0%, #f7f7fb 100%);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1f2430;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 20px 70px;
  }
  h1 {
    font-size: clamp(2.3rem, 6.6vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-align: center;
    background: linear-gradient(115deg, #ff6b35, #f7931e 52%, #ff3d71);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 14px;
    color: #8b93a7;
    font-size: .95rem;
    text-align: center;
    line-height: 1.75;
  }
  .box { width: 100%; max-width: 780px; margin-top: 34px; }
  .ask {
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 8px 10px;
    background: #fff;
    border: 1.5px solid #ececf2;
    border-radius: 24px;
    box-shadow: 0 10px 34px rgba(31, 36, 48, .08);
  }
  .line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .line.lead {
    border-bottom: 1px solid #f3f3f8;
    margin-bottom: 4px;
    padding: 2px 10px 8px;
    gap: 12px;
  }
  .line.lead .lbl { padding-left: 14px; }
  .line.lead .menu { max-height: 320px; overflow: auto; }
  .menu.wide { min-width: 240px; }
  .menu.wide button { display: flex; justify-content: space-between; gap: 10px; }
  .menu.wide button .area { color: #a6acbd; font-size: .8rem; font-weight: 500; }
  .menu.wide button.on .area { color: #ffb08a; }
  .seg {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    min-height: 60px;
  }
  .seg .lbl {
    font-size: .92rem;
    color: #9aa0b0;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .pick {
    font: inherit;
    font-size: 1.24rem;
    font-weight: 700;
    color: #1f2430;
    background: transparent;
    border: 0;
    outline: none;
    cursor: pointer;
    padding: 0 22px 0 0;
    -webkit-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #b9bfd0 50%), linear-gradient(135deg, #b9bfd0 50%, transparent 50%);
    background-position: calc(100% - 9px) 56%, calc(100% - 4px) 56%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition: color .15s;
  }
  .pick:hover { color: #ff6b35; }
  .dd { position: relative; }
  .dd .pick { display: inline-flex; align-items: center; gap: 10px; }
  .menu {
    position: absolute;
    top: calc(100% + 10px);
    left: -12px;
    min-width: 168px;
    padding: 7px;
    background: #fff;
    border: 1px solid #ececf2;
    border-radius: 16px;
    box-shadow: 0 20px 46px rgba(31, 36, 48, .16);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px) scale(.98);
    transform-origin: top left;
    transition: opacity .16s, transform .16s, visibility .16s;
    z-index: 40;
  }
  .dd.open .menu { opacity: 1; visibility: visible; transform: none; }
  .menu button {
    display: block;
    width: 100%;
    padding: 11px 14px;
    border: 0;
    border-radius: 10px;
    background: none;
    font: inherit;
    font-size: 1.1rem;
    color: #2b3142;
    text-align: left;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .menu button:hover { background: #fff5ee; color: #ff6b35; }
  .menu button.on { background: #fff8f3; color: #ff6b35; font-weight: 700; }
  .menu button.on::after { content: '✓'; float: right; font-size: .95rem; }
  .sep { width: 1px; background: #f0f0f5; margin: 12px 0; }
  .num {
    width: 3.1em;
    font: inherit;
    font-size: 1.24rem;
    font-weight: 700;
    color: #1f2430;
    text-align: center;
    background: transparent;
    border: 0;
    border-bottom: 2px dashed #d8dae5;
    outline: none;
    padding: 2px 0;
    transition: border-color .15s, color .15s;
  }
  .num:focus { border-bottom-color: #ff6b35; color: #ff6b35; }
  .num::placeholder { color: #c9cdd9; font-weight: 500; }
  .dash { color: #c3c7d4; margin: 0 6px; font-size: 1.1rem; }
  .unit { color: #9aa0b0; font-size: 1rem; }
  .ask .go { margin-left: auto; align-self: center; padding: 16px 34px; border-radius: 16px; font-size: 1.12rem; }
  @media (max-width: 680px) {
    .sep { display: none; }
    .seg { padding: 10px 12px; min-height: 52px; }
    .pick, .num { font-size: 1.1rem; }
    .ask .go { width: 100%; margin: 8px 0 0; }
  }
  .row { display: flex; gap: 12px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  button.go {
    padding: 13px 30px;
    font-size: 1rem; font-family: inherit; font-weight: 600;
    color: #fff;
    background: linear-gradient(120deg, #ff6b35, #ff3d71);
    border: 0; border-radius: 12px; cursor: pointer;
    transition: transform .12s, opacity .18s;
  }
  button.go:hover { transform: translateY(-1px); }
  button.go:active { transform: translateY(1px); }
  button.go:disabled { opacity: .55; cursor: default; transform: none; }
  .tag { font-size: .82rem; color: #9aa1b2; }

  #out {
    width: 100%;
    max-width: 900px;
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    align-items: stretch;
  }
  #out .note { grid-column: 1 / -1; }
  #out .empty { grid-column: 1 / -1; }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1;
    padding: 20px 20px 18px;
    background: #fff;
    border: 1px solid #f0f0f5;
    border-radius: 20px;
    box-shadow: 0 14px 38px -22px rgba(31, 36, 48, .42);
    animation: pop .36s cubic-bezier(.2, .8, .3, 1.15) both;
    transition: transform .18s, box-shadow .18s;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 46px -22px rgba(31, 36, 48, .45);
  }
  .card:nth-child(2) { animation-delay: .07s; }
  .card:nth-child(3) { animation-delay: .14s; }
  .card:nth-child(4) { animation-delay: .21s; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.93); }
    to   { opacity: 1; transform: none; }
  }
  @media (max-width: 900px) {
    #out { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    #out { grid-template-columns: 1fr; }
    .card { aspect-ratio: auto; }
  }
  .shop {
    font-size: .78rem; color: #ff8a4c; font-weight: 600;
    letter-spacing: .02em; margin-bottom: 6px;
  }
  .dish {
    font-size: 1.2rem; font-weight: 700; line-height: 1.45;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .dish .name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .price { font-size: 1rem; color: #ff3d71; font-weight: 700; }
  .price span { font-size: .78rem; font-weight: 500; }
  .meta {
    font-size: .74rem; font-weight: 500; color: #8b93a7;
    background: #f5f6fa; padding: 2px 9px; border-radius: 999px;
    vertical-align: middle;
  }
  .why {
    margin-top: 8px;
    font-size: .86rem; color: #5c6478; line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .note {
    text-align: center; color: #b26a00; font-size: .86rem;
    background: #fff8e6; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .empty {
    text-align: center; color: #8b93a7; font-size: .92rem; padding: 24px;
  }
  footer { margin-top: 50px; font-size: .8rem; color: #b6bccb; }
  footer a { color: #b6bccb; text-decoration: none; border-bottom: 1px dashed #d8dce6; }

  /* ---- 右上角的两个按钮 ---- */
  .topbar { position: fixed; top: 18px; right: 18px; z-index: 50; display: flex; gap: 8px; }
  #dice, #gear {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 18px;
    font-family: inherit;
    font-size: .92rem;
    font-weight: 600;
    color: #fff;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .14s, box-shadow .2s, opacity .2s;
    -webkit-tap-highlight-color: transparent;
  }
  #dice { background: linear-gradient(125deg, #7b5cff, #ff3d71 85%); box-shadow: 0 10px 24px -8px rgba(123, 92, 255, .65); }
  #dice:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px -8px rgba(123, 92, 255, .75); }
  #dice:active { transform: translateY(0) scale(.97); }
  #dice:disabled { opacity: .6; cursor: default; transform: none; }
  #dice .die { font-size: 1.05rem; display: inline-block; }
  #dice.rolling .die { animation: spin .55s ease; }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(180deg) scale(1.28); }
    100% { transform: rotate(360deg) scale(1); }
  }
  #gear { background: #fff; color: #6b7280; border: 1px solid #e8e9f0; padding: 11px 14px; }
  #gear:hover { color: #7b5cff; border-color: #d9d4ff; }
  #gear.ok { color: #12a150; border-color: #c7efd8; }

  /* ---- 弹窗 ---- */
  .mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(26, 22, 36, .42);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .mask.show { opacity: 1; pointer-events: auto; }

  .modal {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 30px 26px 24px;
    text-align: center;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 34px 90px -26px rgba(26, 22, 36, .6);
    transform: translateY(16px) scale(.95);
    transition: transform .3s cubic-bezier(.18, .9, .3, 1.25);
    overflow: hidden;
  }
  .mask.show .modal { transform: none; }
  .modal::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: linear-gradient(90deg, #7b5cff, #ff3d71, #ff9330);
  }
  .modal .big {
    font-size: 2.4rem;
    line-height: 1;
    margin-bottom: 10px;
    display: block;
  }
  .modal .m-shop {
    font-size: .8rem;
    font-weight: 600;
    color: #ff8a4c;
    letter-spacing: .02em;
  }
  .modal .m-dish {
    margin-top: 10px;
    font-size: 1.62rem;
    font-weight: 800;
    line-height: 1.35;
    color: #1f2430;
    word-break: break-word;
  }
  .modal .m-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .modal .m-price {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ff3d71;
  }
  .modal .m-price span { font-size: .9rem; font-weight: 600; }
  .modal .m-spicy {
    font-size: .78rem;
    font-weight: 600;
    color: #7b5cff;
    background: #f2efff;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .modal .m-why {
    margin-top: 16px;
    font-size: .92rem;
    line-height: 1.8;
    color: #5c6478;
  }
  .modal .m-btns {
    margin-top: 24px;
    display: flex;
    gap: 10px;
  }
  .modal button {
    flex: 1;
    padding: 13px 0;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .12s, opacity .18s, background .18s;
  }
  .m-again {
    color: #fff;
    background: linear-gradient(120deg, #7b5cff, #ff3d71);
    box-shadow: 0 10px 22px -12px rgba(123, 92, 255, .9);
  }
  .m-again:hover { transform: translateY(-1px); }
  .m-close { color: #6b7280; background: #f3f4f8; }
  .m-close:hover { background: #e9ebf2; }
  .modal button:active { transform: scale(.98); }

  .m-copy {
    margin-top: 14px;
    width: 100%;
    padding: 11px 0;
    font-family: inherit;
    font-size: .88rem;
    font-weight: 700;
    color: #6b5bd6;
    background: #f1eeff;
    border: 1px dashed #c9bdf5;
    border-radius: 12px;
    cursor: pointer;
  }
  .m-copy:hover { background: #e9e3ff; }

  .card .copy {
    margin-top: auto;
    padding: 9px 12px;
    font-family: inherit;
    font-size: .8rem;
    font-weight: 700;
    color: #6b5bd6;
    background: #f1eeff;
    border: 1px dashed #c9bdf5;
    border-radius: 9px;
    cursor: pointer;
  }
  .card .copy:hover { background: #e9e3ff; }
  .card .copy.done { color: #147a3d; background: #e6f7ec; border-color: #a9dcbd; }

  /* ---- 设置密钥的弹窗，样式另算 ---- */
  #keyset .modal { text-align: left; }
  #keyset .k-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
  #keyset .k-tip { font-size: .84rem; color: #8b93a7; line-height: 1.75; margin-bottom: 14px; }
  #keyset input {
    width: 100%;
    padding: 12px 14px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .88rem;
    border: 1.5px solid #ececf2;
    border-radius: 12px;
    outline: none;
  }
  #keyset input:focus { border-color: #7b5cff; box-shadow: 0 0 0 4px rgba(123,92,255,.12); }
  #keyset .k-btns { display: flex; gap: 10px; margin-top: 16px; }
  #keyset .k-btns button { flex: 1; padding: 12px 0; }
  #keyset .k-save { color: #fff; background: linear-gradient(120deg, #7b5cff, #ff3d71); }
  #keyset .k-del { color: #b3261e; background: #fdf1f0; }
  #keyset a { color: #7b5cff; }

  @media (max-width: 480px) {
    .topbar { top: 12px; right: 12px; }
    #dice { padding: 9px 14px; font-size: .84rem; }
    #gear { padding: 9px 12px; font-size: .84rem; }
    .modal { padding: 26px 20px 20px; }
    .modal .m-dish { font-size: 1.4rem; }
  }

  /* ================= v5 优化：数据条 / 结果条 / 卡片微交互 ================= */
  :root{
    --ink:#1f2430; --muted:#6b7280; --hair:#efe9e3;
    --brand:#ff6b35; --brand-2:#ff3d71; --warm-bg:#fff8ef; --warm-line:#ffe3c9;
  }
  .data-note{
    display:none;
  }
  .data-note b{ color:var(--brand); font-weight:800; }

  /* 角落小字：收录规模，不抢视线 */
  .corner-note{
    position:fixed; left:18px; bottom:14px; z-index:20;
    margin:0; padding:0; font-size:.74rem; letter-spacing:.02em;
    color:#b3b8c2; pointer-events:none; user-select:none;
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .corner-note b{ color:#c9b8ad; font-weight:700; }

  /* 结果条：一句结论 + 换一批 / 清空条件 */
  .note{
    display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;
    max-width:900px; margin:0 auto 20px; padding:13px 16px;
    background:var(--warm-bg); border:1px solid var(--warm-line);
    border-radius:16px; color:#8a5a2b; font-size:.9rem; line-height:1.5;
  }
  .note .txt{ flex:1 1 100%; text-align:center; }
  .note .acts{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .note button{
    border:1px solid #ffd2ad; background:#fff; color:#d2691e;
    font:inherit; font-size:.85rem; font-weight:700;
    padding:7px 15px; border-radius:999px; cursor:pointer; transition:.16s;
  }
  .note button:hover{ background:#fff2e2; transform:translateY(-1px); }
  .note button.ghost{ border-color:var(--hair); color:#7b8190; }
  .note button.ghost:hover{ background:#f7f5f3; }

  /* 卡片：悬停抬升 + 食堂/店铺两级 + 更透气的排版 */
  .card{ transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover{ transform:translateY(-4px); box-shadow:0 18px 40px rgba(31,36,48,.10); }
  .card .shop{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card .shop .area{ color:#9aa1ad; font-size:.76rem; letter-spacing:.03em; }
  .card .shop .dot{ color:#d6d2cd; }
  .card .shop .nm{ color:#ff8a4c; font-weight:800; }
  .card .why{ color:#5b6270; }

  /* 空状态：给出口，而不是一句“没找到” */
  .empty{
    max-width:560px; margin:34px auto; text-align:center; background:#fff;
    border:1px dashed #f0d9c6; border-radius:20px; padding:30px 22px; color:var(--muted);
  }
  .empty strong{ display:block; color:var(--ink); font-size:1.08rem; margin-bottom:8px; }
  .empty p{ margin:0 0 4px; font-size:.92rem; line-height:1.6; }
  .empty .acts{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .empty button{
    border:0; background:linear-gradient(125deg,#ff8a4c,#ff3d71); color:#fff;
    font:inherit; font-weight:700; font-size:.9rem; padding:11px 22px;
    border-radius:999px; cursor:pointer; box-shadow:0 10px 22px rgba(255,90,120,.28);
  }
  .empty button.ghost{
    background:#fff; color:#7b8190; box-shadow:none; border:1px solid var(--hair);
  }

  @media (max-width:680px){
    .line.lead{ flex-wrap:wrap; row-gap:10px; }
    .line.lead .dd{ flex:1 1 100%; }
    .data-note{ margin:-6px 0 16px; font-size:.8rem; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <button id="dice" title="不想想，直接随机一个"><span class="die">🎲</span><span>随机</span></button>
  </div>

  <!-- 随机结果 -->
  <div class="mask" id="mask" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-dish">
      <span class="big">🎲</span>
      <div class="m-shop" id="m-shop"></div>
      <div class="m-dish" id="m-dish"></div>
      <div class="m-row">
        <div class="m-price" id="m-price"></div>
        <div class="m-spicy" id="m-spicy"></div>
      </div>
      <p class="m-why" id="m-why"></p>
      <button class="m-copy" id="m-copy">📋 复制菜名，去小程序搜</button>
      <div class="m-btns">
        <button class="m-again" id="m-again">再抽一次</button>
        <button class="m-close" id="m-close">就吃这个</button>
      </div>
    </div>
  </div>

  <h1>今天吃什么</h1>
  <p class="sub">选一下想吃的类型、辣度和预算，我给你挑三道。</p>

  <div class="box">
    <div class="ask">
      <div class="line lead">
        <span class="lbl">食堂</span>
        <div class="dd" id="ddArea">
          <button class="pick" type="button"><span class="val">全部食堂</span></button>
          <div class="menu wide" id="areaMenu"></div>
        </div>
        <span class="sep"></span>
        <span class="lbl">店铺</span>
        <div class="dd" id="ddShop">
          <button class="pick" type="button"><span class="val">全部店铺</span></button>
          <div class="menu wide" id="shopMenu"></div>
        </div>
      </div>
      <div class="line top">
      <div class="seg">
        <span class="lbl">想吃</span>
        <div class="dd" id="ddType">
          <button class="pick" type="button"><span class="val">都行</span></button>
          <div class="menu">
            <button type="button" data-v="" class="on">都行</button>
            <button type="button" data-v="饭">饭</button>
            <button type="button" data-v="面">面</button>
            <button type="button" data-v="粉">粉</button>
            <button type="button" data-v="粥">粥</button>
            <button type="button" data-v="饺">饺子</button>
            <button type="button" data-v="包">包子</button>
            <button type="button" data-v="炸鸡">炸鸡汉堡</button>
            <button type="button" data-v="小吃">小吃</button>
          </div>

const SPICY = ['不辣', '微辣', '中辣', '特辣'];
const TYPE_WORD = { 饭: '有饭', 面: '面食', 粉: '粉类', 粥: '粥类', 饺: '饺子', 包: '包子', 炸鸡: '炸鸡汉堡', 小吃: '小吃' };

const $ = id => document.getElementById(id);
const $go = $('go'), $out = $('out'), $dice = $('dice');
const $fMin = $('fMin'), $fMax = $('fMax');

/* ---------- 自定义下拉（原生 select 的弹层没法改样式，太丑） ---------- */
const DD = [];
function closeAllDD() { DD.forEach(d => d.root.classList.remove('open')); }
document.addEventListener('click', closeAllDD);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllDD(); });

function makeDD(id, items, onPick) {
  const root = $(id);
  const trigger = root.querySelector('.pick');
  const valEl = trigger.querySelector('.val');
  const menu = root.querySelector('.menu');

  menu.innerHTML = items.map((it, i) =>
    '<button type="button" data-v="' + esc(it.v) + '" data-label="' + esc(it.label) + '"' + (i === 0 ? ' class="on"' : '') + '>' +
    '<span>' + esc(it.label) + '</span>' +
    (it.note ? '<span class="area">' + esc(it.note) + '</span>' : '') +
    '</button>').join('');

  const state = { root, value: items.length ? items[0].v : '' };
  valEl.textContent = items.length ? items[0].label : '';

  const btns = Array.from(menu.querySelectorAll('button'));
  trigger.onclick = (e) => {
    e.stopPropagation();
    const willOpen = !root.classList.contains('open');
    closeAllDD();
    if (willOpen) root.classList.add('open');
  };
  btns.forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      state.value = b.dataset.v;
      valEl.textContent = b.dataset.label;
      btns.forEach(x => x.classList.toggle('on', x === b));
      root.classList.remove('open');
      if (onPick) onPick(state.value);
    };
  });

  const idx = DD.findIndex(d => d.root === root);
  if (idx >= 0) DD[idx] = state; else DD.push(state);
  return state;
}

const ddType = makeDD('ddType', [
  { v: '', label: '都行' }, { v: '饭', label: '饭' }, { v: '面', label: '面' }, { v: '粉', label: '粉' },
  { v: '粥', label: '粥' }, { v: '饺', label: '饺子' }, { v: '包', label: '包子' }, { v: '炸鸡', label: '炸鸡汉堡' }, { v: '小吃', label: '小吃' }
]);

]);

/* 店名形如「丽园轩餐厅 · 手工米粉」：显示短名，筛选用全名 */
const shortShop = s => String(s || '').split('·').pop().trim();
const areaOf = s => { const a = String(s || '').split('·'); return a.length > 1 ? a[0].trim() : ''; };
const AREAS = Array.from(new Set(MENU.shops.map(s => areaOf(s.name))));
const shopsIn = area => MENU.shops.filter(s => !area || areaOf(s.name) === area);

let ddArea = null, ddShop = null;
function fillShops(area) {
  ddShop = makeDD('ddShop',
    [{ v: '', label: '全部店铺' }].concat(shopsIn(area).map(s => ({ v: s.name, label: shortShop(s.name) }))));
}
ddArea = makeDD('ddArea',
  [{ v: '', label: '全部食堂' }].concat(AREAS.map(a => ({ v: a, label: a }))),
  (v) => fillShops(v));
fillShops('');

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- 渲染推荐卡片 ---------- */
function render(picks, note) {
  if (!picks || !picks.length) {
    $out.innerHTML =
      '<div class="empty">'
      + '<strong>这套条件一道都没筛出来</strong>'
      + '<p>多半是预算卡太死，或者类型限定得太窄。</p>'
      + '<p>把价格放宽一点，或者类型换回「都行」再试。</p>'
      + '<div class="acts">'
      + '<button id="clearFromEmpty">清空条件，重新选</button>'
      + '<button class="ghost" id="looseFromEmpty">只放宽预算</button>'
      + '</div></div>';
    $('clearFromEmpty').onclick = clearAll;
    $('looseFromEmpty').onclick = () => { $fMin.value = ''; $fMax.value = ''; runPick(); };
    return;
  }
  const noteHtml = note
    ? '<div class="note"><span class="txt">' + esc(note) + '</span>'
      + '<span class="acts">'
      + '<button id="againBtn">换一批</button>'
      + '<button class="ghost" id="clearBtn">清空条件</button>'
      + '</span></div>'
    : '';
  $out.innerHTML = noteHtml + picks.map(p => {
    const a = areaOf(p.shop), s = shortShop(p.shop);
    const head = a
      ? '<span class="area">' + esc(a) + '</span><span class="dot">·</span><span class="nm">' + esc(s) + '</span>'
      : '<span class="nm">' + esc(s) + '</span>';
    return '<div class="card">'
      + '<div class="shop">' + head + '</div>'
      + '<div class="dish"><span class="name">' + esc(p.dish || '') + '</span>'
      + '<span class="price"><span>¥</span>' + esc(p.price == null ? '?' : p.price) + '</span>'
      + '<span class="meta">' + esc(p.spicy || '') + '</span>'
      + '</div>'
      + '<p class="why">' + esc(p.why || '') + '</p>'
      + '<button class="copy" data-dish="' + esc(p.dish || '') + '">📋 复制菜名，去小程序搜</button>'
      + '</div>';
  }).join('');
  const again = $('againBtn'), clr = $('clearBtn');
  if (again) again.onclick = runPick;
  if (clr) clr.onclick = clearAll;
}

/* ---------- 打分：本地筛菜 ---------- */

function dishMatchesType(name, cat, t) {
  const n = name;
  if (t === '饭') { if (/稀饭|粥|汤|豆浆/.test(n)) return false; return /饭/.test(n) || (cat === '饭' && !/单卖|单点/.test(n)); }
  if (t === '面') return /面(?!筋)|米线|河粉|肠粉|馄饨/.test(n) && !/老面|面筋/.test(n);
  if (t === '粉') return /粉|米线|河粉/.test(n);
  if (t === '粥') return /粥/.test(n);
  if (t === '饺') return /饺|馄饨/.test(n);
  if (t === '包') return /小笼包|灌汤包|叉烧包|生煎包|豆沙包|肉包|菜包|汤包|烧麦|馒头|包子/.test(n) && !/蛋包|面包|包菜|包心/.test(n);
  if (t === '炸鸡') return /汉堡|炸鸡|手枪腿|鸡排|鸡块|翅|鸡腿堡|鸡肉卷|薯条|肉排|鸡米花/.test(n) && !/包(?!菜)|馍/.test(n);
  if (t === '小吃') return cat === '小吃';
  return false;
}

/* 按个/按片卖的馅料、加料，别当成一顿饭 */
const ADDONISH = /馅|加料|调料|酱$|克|\(个\)|（个）|片\)|碗\)|小份|大份/;

function recommend(cr) {
  const type = cr.type || null;
  const spicyTarget = (cr.spicy === undefined || cr.spicy === null) ? null : cr.spicy;
  const min = (cr.min === undefined || cr.min === null || isNaN(cr.min)) ? null : cr.min;
  const max = (cr.max === undefined || cr.max === null || isNaN(cr.max)) ? null : cr.max;
  const shopFilter = cr.shop || null;
  const areaFilter = cr.area || null;
  const loose = (!type && spicyTarget == null && min == null && max == null && !shopFilter && !areaFilter);

  const pool = [];
  MENU.shops.forEach(shop => {
    if (shopFilter && shop.name !== shopFilter) return;
    if (!shopFilter && areaFilter && areaOf(shop.name) !== areaFilter) return;
    return shop.dishes.forEach(d => {
    const nm = d.name || '';
    if (nm.length > 24) return;                     // 抄录时截断的长名，数据脏
    const price = d.price;
    if (price < 2) return;                            // 按个卖的馅料/加料，不是一顿饭
    if (max != null && price > max + 0.5) return;
    if (min != null && price < min - 0.5) return;
    if (type && !dishMatchesType(nm, d.cat, type)) return;   // 指定类型就严格只要这类

    let score = 1;
    const why = [];

    if (type) { score += 40; why.push(TYPE_WORD[type] || type); }

    if (spicyTarget != null) {
      const diff = Math.abs((d.spicy || 0) - spicyTarget);
      score += diff === 0 ? 30 : diff === 1 ? 2 : -30;
      if (diff <= 1) why.push(SPICY[(d.spicy || 0)] || '不辣');
    } else if ((d.spicy || 0) === 0) {
      score += 4;
    }

    if (max != null) { score += 10 - Math.min(price, 20) * 0.3; why.push('¥' + price + ' 在预算内'); }

    if (loose) {
      if (price >= 5 && price <= 15) { score += 10; }
      if (price < 5) { score -= 8; }
      if (price > 18) { score -= 10; }
    } else if (price < 4) {
      score -= 14;                                    // 一两块的小份菜，当不了一顿饭
    }

    if (/饭|面|粉|粥|饺|馄饨|套餐|盖浇|拌饭/.test(nm)) score += 8;   // 正餐加分
    if (/单卖|单点|加料|另加/.test(nm)) score -= 12;

    if (ADDONISH.test(nm) && price < 3) score -= 30;   // 0.7 元一个的馅料不该排在饭前面

    pool.push({ shop: shop.name, dish: nm, price: price, spicy: d.spicy || 0, cat: d.cat, score: score + Math.random() * 3, why });
    });
  });
  pool.sort((a, b) => b.score - a.score);

  const picked = [];
  const usedShop = {};
  for (const p of pool) {
    if (picked.length >= 3) break;
    if (usedShop[p.shop]) continue;
    usedShop[p.shop] = 1;
    picked.push(p);
  }
  for (const p of pool) {
    if (picked.length >= 3) break;
    if (picked.includes(p)) continue;
    picked.push(p);
  }

  const cond = [];
  if (shopFilter) cond.push(shortShop(shopFilter));
  else if (areaFilter) cond.push(areaFilter);
  if (type) cond.push(type);
  if (spicyTarget != null) cond.push(SPICY[spicyTarget]);
  if (min != null && max != null) cond.push(min + '–' + max + ' 元');
  else if (max != null) cond.push(max + ' 元内');
  else if (min != null) cond.push(min + ' 元以上');

  let note;
  if (!pool.length) {
    note = '按「' + (cond.join(' + ') || '这套条件') + '」一道都没有 —— 把价格区间放宽一点，或者类型换成「随便」试试。';
  } else if (cond.length) {
    note = '按「' + cond.join(' + ') + '」筛出 ' + pool.length + ' 道，给你挑了这几道。';
  } else {
    note = '没选条件，按「一份正常的饭/面、十块上下、不太辣」给你挑了这几道。';
  }

  return {
    picks: picked.map(p => ({
      shop: p.shop,
      dish: p.dish,
      price: p.price,
      spicy: SPICY[Math.min(p.spicy, 3)],
      why: (p.why.length ? p.why.join(' · ') : '看着顺口') + '，想吃就点这个。'
    })),
    note
  };
}

/* ---------- 帮我选（本地计算，不联网） ---------- */
function readCriteria() {
  const type = ddType.value || null;
  const sp = ddSpicy.value === '' ? null : Number(ddSpicy.value);
  const mnRaw = $fMin.value, mxRaw = $fMax.value;
  const mn = mnRaw === '' ? null : Number(mnRaw);
  const mx = mxRaw === '' ? null : Number(mxRaw);
  const shopSel = ddShop.value || null;
  const areaSel = ddArea.value || null;
  return {
    type, spicy: sp, min: mn, max: mx,
    shop: shopSel || null,
    area: shopSel ? null : (areaSel || null)
  };
}

function runPick() {
  const cr = readCriteria();
  $go.disabled = true;
  try {
    const r = recommend(cr);
    render(r.picks, r.note);
    requestAnimationFrame(() => $out.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  } finally {
    $go.disabled = false;
  }
}

function setDD(state, v) {
  if (!state || !state.root) return;
  const btns = Array.from(state.root.querySelectorAll('.menu button'));
  if (!btns.length) return;
  const hit = btns.find(b => b.dataset.v === v) || btns[0];
  state.value = hit.dataset.v;
  const valEl = state.root.querySelector('.pick .val');
  if (valEl) valEl.textContent = hit.dataset.label;
  btns.forEach(b => b.classList.toggle('on', b === hit));
}

function clearAll() {
  setDD(ddArea, '');
  fillShops('');
  setDD(ddShop, '');
  setDD(ddType, '');
  setDD(ddSpicy, '');
  $fMin.value = '';
  $fMax.value = '';
  runPick();
}

$go.onclick = runPick;
[$fMin, $fMax].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runPick(); } });
});

/* 顶部数据条：让人一眼看到收录规模 */
(function fillDataNote() {
  const shops = MENU.shops.length;
  const dishes = MENU.shops.reduce((n, s) => n + s.dishes.length, 0);
  const areas = new Set(MENU.shops.map(s => areaOf(s.name))).size;
  const el = $('dataNote');
  if (el) el.innerHTML = '已收录 <b>' + shops + '</b> 家店 · <b>' + dishes + '</b> 道菜 · '
    + areas + ' 个食堂';
})();

/* ---------- 随机：完全在本地，不需要网络 ---------- */
let MENU_CACHE = MENU.shops;

function luckyPick(shops) {
  const shop = shops[Math.floor(Math.random() * shops.length)];
  const dish = shop.dishes[Math.floor(Math.random() * shop.dishes.length)];
  const yes = ['就它了', '今天吃这个', '别犹豫了', '天意', '抽到就是缘分'];
  return {
    shop: shop.name,
    dish: dish.name,
    price: dish.price,
    spicy: SPICY[Math.min(dish.spicy || 0, 3)],
    why: yes[Math.floor(Math.random() * yes.length)] + '，别再纠结了。'
  };
}

const $mask = $('mask');
let lastPick = null;
function openModal(one) {
  lastPick = one;
  $('m-shop').textContent = one.shop;
  $('m-dish').textContent = one.dish;
  $('m-price').innerHTML = '<span>¥</span>' + esc(one.price);
  $('m-spicy').textContent = one.spicy;
  $('m-why').textContent = one.why;
  $mask.classList.add('show');
  $mask.setAttribute('aria-hidden', 'false');
}
function closeModal() { $mask.classList.remove('show'); $mask.setAttribute('aria-hidden', 'true'); }
$mask.onclick = e => { if (e.target === $mask) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('m-close').onclick = closeModal;

async function roll() {
  $dice.disabled = true;
  $dice.classList.remove('rolling');
  void $dice.offsetWidth;
  $dice.classList.add('rolling');
  await new Promise(r => setTimeout(r, 420));
  openModal(luckyPick(MENU_CACHE));
  $dice.disabled = false;
}
$('m-again').onclick = () => roll();
$dice.onclick = roll;

/* ---------- 复制菜名（跳到小程序里搜） ---------- */
function copyDish(btn, dish) {
  const ok = () => {
    const old = btn.textContent;
    btn.textContent = '✅ 已复制，去小程序搜索框粘贴';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1800);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = dish;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(dish).then(ok, fallback);
  } else {
    fallback();
  }
}
$out.addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if (b) copyDish(b, b.dataset.dish || '');
});
$('m-copy').onclick = function () {
  if (lastPick) copyDish(this, lastPick.dish);
};
</script>
</body>
</html>
