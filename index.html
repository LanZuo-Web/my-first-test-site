<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: #6b7280;
      margin: 0 0 28px;
      line-height: 1.7;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px 26px;
      text-align: left;
      box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.18);
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 14px;
      color: #111827;
    }
    .card ul {
      margin: 0;
      padding-left: 20px;
      line-height: 2;
      color: #374151;
      font-size: 0.95rem;
    }
    .tip {
      margin-top: 26px;
      font-size: 0.85rem;
      color: #9ca3af;
      line-height: 1.7;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #4338ca;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">v0.1 · 本地版本</div>
    <h1>你好，我是 XXX 👋</h1>
    <p class="sub">这是我写的第一个网页。<br>它现在只在我的电脑上，很快就要上线了。</p>

    <div class="card">
      <h2>关于我</h2>
      <ul>
        <li>正在学：AI 全栈开发</li>
        <li>今天完成了：写好第一个网页、把它推进 GitHub</li>
        <li>下一步：挂到 Render，拿到一个谁都能打开的公网网址</li>
      </ul>
    </div>

    <p class="tip">试着把上面的文字改掉、保存、刷新浏览器 —— 你会立刻看到变化。<br>这就是网页开发最原始的快感。</p>
  </main>
</body>
</html>
