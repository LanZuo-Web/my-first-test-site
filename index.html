const SPICY = ['不辣', '微辣', '中辣', '特辣'];
const CN_NUM = { '零':0,'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };

const $ = id => document.getElementById(id);
const $q = $('q'), $go = $('go'), $out = $('out'), $dice = $('dice');

document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    const t = c.dataset.t;
    $q.value = $q.value.trim() ? $q.value.trim() + '，' + t : t;
    $q.focus();
  };
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- 渲染推荐卡片 ---------- */
function render(picks, note) {
  if (!picks || !picks.length) {
    $out.innerHTML = '<div class="empty">没找到合适的，换个说法再试一次？</div>';
    return;
  }
  const noteHtml = note ? '<div class="note">' + esc(note) + '</div>' : '';
  $out.innerHTML = noteHtml + picks.map(p =>
    '<div class="card">'
    + '<div class="shop">' + esc(p.shop || '') + '</div>'
    + '<div class="dish">' + esc(p.dish || '')
    + '<span class="price"><span>¥</span>' + esc(p.price == null ? '?' : p.price) + '</span>'
    + '<span class="meta">' + esc(p.spicy || '') + '</span>'
    + '</div>'
    + '<p class="why">' + esc(p.why || '') + '</p>'
    + '<button class="copy" data-dish="' + esc(p.dish || '') + '">📋 复制菜名，去小程序搜</button>'
    + '</div>').join('');
}

/* ---------- 从一句话里抠预算 ---------- */
function parseBudget(text) {
  let m = text.match(/(\d+(?:\.\d+)?)\s*(?:块|元|rmb)/i);
  if (m) return parseFloat(m[1]);
  m = text.match(/([零一两二三四五六七八九十]{1,4})\s*(?:块|元)/);
  if (m) {
    const s = m[1];
    if (s.length === 1) return CN_NUM[s] ?? null;
    if (s[0] === '十') return 10 + (CN_NUM[s[1]] || 0);
    if (s[1] === '十') return (CN_NUM[s[0]] || 0) * 10 + (CN_NUM[s[2]] || 0);
  }
  return null;
}

/* ---------- 关键词打分：本地筛菜 ---------- */
const AVOID_RE = /(?:不要|不吃|别放|忌|不能吃)([^，,。、\s]{1,6})/g;
const INGREDIENTS = ['牛肉','牛腩','牛','猪','排骨','鸡','鸭','鱼','虾','蟹','蛋','豆腐','豆皮','腐竹','青菜','蔬菜','素','饺子','馄饨','包子','汉堡','炸鸡','烤','汤','麻辣烫','香锅','烧腊','卤','叉烧','肥牛','肉片','米线','肠粉','粥','螺蛳'];

function parseType(text) {
  if (/饭|米饭|盖饭|拌饭/.test(text)) return '饭';
  if (/面/.test(text)) return '面';
  if (/粉/.test(text)) return '粉';
  if (/粥/.test(text)) return '粥';
  if (/饺/.test(text)) return '饺';
  if (/包/.test(text)) return '包';
  if (/小吃|零食/.test(text)) return '小吃';
  return null;
}
function parseSpicy(text) {
  if (/不辣|不要辣|不吃辣|无辣|清汤/.test(text)) return 0;
  if (/微辣|小辣|一点点辣/.test(text)) return 1;
  if (/特辣|变态辣|很辣|超级辣/.test(text)) return 3;
  if (/辣/.test(text)) return 2;
  return null;
}

function dishMatchesType(name, cat, t) {
  const n = name;
  if (t === '饭') return (/饭/.test(n) && !/稀饭|粥/.test(n)) || (cat === '饭' && !/单卖|单点/.test(n));
  if (t === '面') return /面(?!筋)|米线|河粉|肠粉|馄饨/.test(n) && !/老面|面筋/.test(n);
  if (t === '粉') return /粉|米线|河粉/.test(n);
  if (t === '粥') return /粥/.test(n);
  if (t === '饺') return /饺|馄饨/.test(n);
  if (t === '包') return /包(?!菜)|馍|汉堡/.test(n);
  if (t === '小吃') return cat === '小吃';
  return false;
}

/* 按个/按片卖的馅料、加料，别当成一顿饭 */
const ADDONISH = /馅|加料|调料|酱$|克|\(个\)|（个）|片\)|碗\)|小份|大份/;

function recommend(textRaw) {
  const text = String(textRaw).replace(/\s+/g, '');
  const budget = parseBudget(text);
  const type = parseType(text);
  const spicyTarget = parseSpicy(text);
  const avoid = [...text.matchAll(AVOID_RE)].map(m => m[1]);
  const rawHits = INGREDIENTS.filter(w => text.includes(w));
  const hits = rawHits.filter(w => !rawHits.some(o => o !== w && o.includes(w)));
  const loose = (!type && spicyTarget == null && budget == null && !hits.length);

  const pool = [];
  MENU.shops.forEach(shop => shop.dishes.forEach(d => {
    const nm = d.name || '';
    if (nm.length > 24) return;                     // 抄录时截断的长名，数据脏
    if (avoid.some(a => nm.includes(a))) return;
    if (budget != null && d.price > budget + 0.5) return;
    if (type && !dishMatchesType(nm, d.cat, type)) return;   // 指定类型就严格只要这类

    let score = 1;
    const why = [];

    if (type) { score += 40; why.push(type === '饭' ? '有饭' : type === '面' ? '面食' : type + '类'); }

    if (spicyTarget != null) {
      const diff = Math.abs((d.spicy || 0) - spicyTarget);
      score += diff === 0 ? 30 : diff === 1 ? 2 : -30;
      if (diff === 0) why.push(SPICY[(d.spicy || 0)] || '不辣');
    } else if ((d.spicy || 0) === 0) {
      score += 4;
    }

    hits.forEach(w => { if (nm.includes(w)) { score += 18; why.push(w); } });

    if (budget != null) { score += 12 - Math.min(d.price, 20) * 0.4; why.push('¥' + d.price + ' 在预算内'); }

    if (loose) {
      if (d.price >= 5 && d.price <= 15) { score += 10; }
      if (d.price < 5) { score -= 8; }
      if (d.price > 18) { score -= 10; }
    } else if (d.price < 4) {
      score -= 14;                                    // 一两块的小份菜，当不了一顿饭
    }

    if (/饭|面|粉|粥|饺|馄饨|套餐|盖浇|拌饭/.test(nm)) score += 8;   // 正餐加分
    if (/单卖|单点|加料|另加/.test(nm)) score -= 12;

    if (ADDONISH.test(nm) && d.price < 3) score -= 30;   // 0.7 元一个的馅料不该排在饭前面

    pool.push({ shop: shop.name, dish: nm, price: d.price, spicy: d.spicy || 0, cat: d.cat, score: score + Math.random() * 3, why });
  }));
  pool.sort((a, b) => b.score - a.score);

  const picked = [];
  const usedShop = {};
  for (const p of pool) {
    if (picked.length >= 3) break;
    if (usedShop[p.shop]) continue;
    usedShop[p.shop] = 1;
    picked.push(p);
  }
  for (const p of pool) {
    if (picked.length >= 3) break;
    if (picked.includes(p)) continue;
    picked.push(p);
  }

  const cond = [];
  if (type) cond.push(type);
  if (spicyTarget != null) cond.push(SPICY[spicyTarget]);
  if (budget != null) cond.push(budget + ' 元内');
  hits.forEach(w => cond.push(w));
  const note = cond.length
    ? '按「' + cond.join(' + ') + '」筛出 ' + pool.length + ' 道，给你挑了 3 道。'
    : '没提具体要求，按「一份正常的饭/面、十块上下、不太辣」给你挑了 3 道。';

  return {
    picks: picked.map(p => ({
      shop: p.shop,
      dish: p.dish,
      price: p.price,
      spicy: SPICY[Math.min(p.spicy, 3)],
      why: (p.why.length ? p.why.join(' · ') : '看着顺口') + '，想吃就点这个。'
    })),
    note
  };
}

/* ---------- 帮我选（本地计算，不联网） ---------- */
$go.onclick = () => {
  const text = $q.value.trim();
  if (!text) { $q.focus(); return; }
  $go.disabled = true;
  try {
    const r = recommend(text);
    render(r.picks, r.note);
  } finally {
    $go.disabled = false;
  }
};

$q.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $go.click(); });

/* ---------- 随机：完全在本地，不需要网络 ---------- */
let MENU_CACHE = MENU.shops;

function luckyPick(shops) {
  const shop = shops[Math.floor(Math.random() * shops.length)];
  const dish = shop.dishes[Math.floor(Math.random() * shop.dishes.length)];
  const yes = ['就它了', '今天吃这个', '别犹豫了', '天意', '抽到就是缘分'];
  return {
    shop: shop.name,
    dish: dish.name,
    price: dish.price,
    spicy: SPICY[Math.min(dish.spicy || 0, 3)],
    why: yes[Math.floor(Math.random() * yes.length)] + '，别再纠结了。'
  };
}

  $('m-shop').textContent = one.shop;
  $('m-dish').textContent = one.dish;
  $('m-price').innerHTML = '<span>¥</span>' + esc(one.price);
  $('m-spicy').textContent = one.spicy;
  $('m-why').textContent = one.why;
  $mask.classList.add('show');
  $mask.setAttribute('aria-hidden', 'false');
}
function closeModal() { $mask.classList.remove('show'); $mask.setAttribute('aria-hidden', 'true'); }
$mask.onclick = e => { if (e.target === $mask) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('m-close').onclick = closeModal;

async function roll() {
  $dice.disabled = true;
  $dice.classList.remove('rolling');
  void $dice.offsetWidth;
  $dice.classList.add('rolling');
  await new Promise(r => setTimeout(r, 420));
  openModal(luckyPick(MENU_CACHE));
  $dice.disabled = false;
}
$('m-again').onclick = () => roll();
$dice.onclick = roll;

/* ---------- 复制菜名（跳到小程序里搜） ---------- */
function copyDish(btn, dish) {
  const ok = () => {
    const old = btn.textContent;
    btn.textContent = '✅ 已复制，去小程序搜索框粘贴';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1800);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = dish;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(dish).then(ok, fallback);
  } else {
    fallback();
  }
}
$out.addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if (b) copyDish(b, b.dataset.dish || '');
});
$('m-copy').onclick = function () {
  if (lastPick) copyDish(this, lastPick.dish);
};
</script>
