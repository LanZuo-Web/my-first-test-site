<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 50% -8%, #ffe4cc 0%, transparent 62%),
      linear-gradient(180deg, #fffaf4 0%, #f7f7fb 100%);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1f2430;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 20px 70px;
  }
  h1 {
    font-size: clamp(2.3rem, 6.6vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-align: center;
    background: linear-gradient(115deg, #ff6b35, #f7931e 52%, #ff3d71);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 14px;
    color: #8b93a7;
    font-size: .95rem;
    text-align: center;
    line-height: 1.75;
  }
  .box { width: 100%; max-width: 620px; margin-top: 30px; }
  textarea {
    width: 100%;
    min-height: 88px;
    padding: 16px 18px;
    font-size: 1rem;
    font-family: inherit;
    line-height: 1.65;
    color: #1f2430;
    background: #fff;
    border: 1.5px solid #ececf2;
    border-radius: 16px;
    resize: vertical;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
    box-shadow: 0 2px 12px rgba(31, 36, 48, .045);
  }
  textarea:focus {
    border-color: #ff8a4c;
    box-shadow: 0 0 0 4px rgba(255, 138, 76, .13);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font-size: .85rem; font-family: inherit; color: #5c6478;
    background: #fff; border: 1px solid #ececf2; border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: #ffb98f; color: #ff6b35; transform: translateY(-1px); }
  .row { display: flex; gap: 12px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  button.go {
    padding: 13px 30px;
    font-size: 1rem; font-family: inherit; font-weight: 600;
    color: #fff;
    background: linear-gradient(120deg, #ff6b35, #ff3d71);
    border: 0; border-radius: 12px; cursor: pointer;
    transition: transform .12s, opacity .18s;
  }
  button.go:hover { transform: translateY(-1px); }
  button.go:active { transform: translateY(1px); }
  button.go:disabled { opacity: .55; cursor: default; transform: none; }
  .tag { font-size: .82rem; color: #9aa1b2; }

  #out { width: 100%; max-width: 620px; margin-top: 30px; }
  .card {
    background: #fff;
    border: 1px solid #f0f0f5;
    border-radius: 16px;
    padding: 18px 22px 20px;
    margin-bottom: 14px;
    box-shadow: 0 12px 34px -20px rgba(31, 36, 48, .38);
    animation: in .3s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  .shop {
    font-size: .78rem; color: #ff8a4c; font-weight: 600;
    letter-spacing: .02em; margin-bottom: 6px;
  }
  .dish {
    font-size: 1.24rem; font-weight: 700;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .price { font-size: 1rem; color: #ff3d71; font-weight: 700; }
  .price span { font-size: .78rem; font-weight: 500; }
  .meta {
    font-size: .74rem; font-weight: 500; color: #8b93a7;
    background: #f5f6fa; padding: 2px 9px; border-radius: 999px;
    vertical-align: middle;
  }
  .why {
    margin-top: 10px;
    font-size: .9rem; color: #5c6478; line-height: 1.75;
  }
  .note {
    text-align: center; color: #b26a00; font-size: .86rem;
    background: #fff8e6; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px;
  }
  .empty {
    text-align: center; color: #8b93a7; font-size: .92rem; padding: 24px;
  }
  footer { margin-top: 50px; font-size: .8rem; color: #b6bccb; }
  footer a { color: #b6bccb; text-decoration: none; border-bottom: 1px dashed #d8dce6; }

  /* ---- 右上角的手气按钮 ---- */
  #dice {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 18px;
    font-family: inherit;
    font-size: .92rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(125deg, #7b5cff, #ff3d71 85%);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 24px -8px rgba(123, 92, 255, .65);
    transition: transform .14s, box-shadow .2s, opacity .2s;
    -webkit-tap-highlight-color: transparent;
  }
  #dice:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px -8px rgba(123, 92, 255, .75); }
  #dice:active { transform: translateY(0) scale(.97); }
  #dice:disabled { opacity: .6; cursor: default; transform: none; }
  #dice .die { font-size: 1.05rem; display: inline-block; }
  #dice.rolling .die { animation: spin .55s ease; }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(180deg) scale(1.28); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* 手气抽出来的那张卡，单独一点样式 */
  .card.lucky {
    border: 1.5px solid #ffe0cc;
    background: linear-gradient(180deg, #fffdfa, #ffffff 42%);
    box-shadow: 0 18px 44px -22px rgba(255, 107, 53, .55);
  }
  .card.lucky .shop::after {
    content: "手气";
    margin-left: 8px;
    padding: 1px 8px;
    font-size: .68rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(120deg, #7b5cff, #ff3d71);
    border-radius: 999px;
    vertical-align: 1px;
  }
  .again {
    margin-top: 14px;
    padding: 9px 18px;
    font-family: inherit;
    font-size: .86rem;
    font-weight: 600;
    color: #7b5cff;
    background: #f4f1ff;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background .16s, transform .12s;
  }
  .again:hover { background: #ebe6ff; transform: translateY(-1px); }

  @media (max-width: 480px) {
    #dice { top: 12px; right: 12px; padding: 9px 14px; font-size: .84rem; }
  }

  /* ---- 随机结果的弹窗 ---- */
  .mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(26, 22, 36, .42);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .mask.show { opacity: 1; pointer-events: auto; }

  .modal {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 30px 26px 24px;
    text-align: center;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 34px 90px -26px rgba(26, 22, 36, .6);
    transform: translateY(16px) scale(.95);
    transition: transform .3s cubic-bezier(.18, .9, .3, 1.25);
    overflow: hidden;
  }
  .mask.show .modal { transform: none; }
  .modal::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: linear-gradient(90deg, #7b5cff, #ff3d71, #ff9330);
  }
  .modal .big {
    font-size: 2.4rem;
    line-height: 1;
    margin-bottom: 10px;
    display: block;
  }
  .modal .m-shop {
    font-size: .8rem;
    font-weight: 600;
    color: #ff8a4c;
    letter-spacing: .02em;
  }
  .modal .m-dish {
    margin-top: 10px;
    font-size: 1.62rem;
    font-weight: 800;
    line-height: 1.35;
    color: #1f2430;
    word-break: break-word;
  }
  .modal .m-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .modal .m-price {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ff3d71;
  }
  .modal .m-price span { font-size: .9rem; font-weight: 600; }
  .modal .m-spicy {
    font-size: .78rem;
    font-weight: 600;
    color: #7b5cff;
    background: #f2efff;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .modal .m-why {
    margin-top: 16px;
    font-size: .92rem;
    line-height: 1.8;
    color: #5c6478;
  }
  .modal .m-btns {
    margin-top: 24px;
    display: flex;
    gap: 10px;
  }
  .modal button {
    flex: 1;
    padding: 13px 0;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .12s, opacity .18s, background .18s;
  }
  .m-again {
    color: #fff;
    background: linear-gradient(120deg, #7b5cff, #ff3d71);
    box-shadow: 0 10px 22px -12px rgba(123, 92, 255, .9);
  }
  .m-again:hover { transform: translateY(-1px); }
  .m-close { color: #6b7280; background: #f3f4f8; }
  .m-close:hover { background: #e9ebf2; }
  .modal button:active { transform: scale(.98); }

  @media (max-width: 480px) {
    .modal { padding: 26px 20px 20px; }
    .modal .m-dish { font-size: 1.4rem; }
  }
</style>
</head>
<body>
  <button id="dice" title="不想想，直接随机一个"><span class="die">🎲</span><span>随机</span></button>

  <div class="mask" id="mask" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-dish">
      <span class="big">🎲</span>
      <div class="m-shop" id="m-shop"></div>
      <div class="m-dish" id="m-dish"></div>
      <div class="m-row">
        <div class="m-price" id="m-price"></div>
        <div class="m-spicy" id="m-spicy"></div>
      </div>
      <p class="m-why" id="m-why"></p>
      <div class="m-btns">
        <button class="m-again" id="m-again">再抽一次</button>
        <button class="m-close" id="m-close">就吃这个</button>
      </div>
    </div>
  </div>

  <h1>今天吃什么</h1>
  <p class="sub">说一句你想吃的，我告诉你去哪家、点哪道。</p>

  <div class="box">
    <textarea id="q" placeholder="比如：想吃面，不要辣，十块左右"></textarea>

    <div class="chips">
      <button class="chip" data-t="想吃面">想吃面</button>
      <button class="chip" data-t="想吃米饭">想吃米饭</button>
      <button class="chip" data-t="想吃粉">想吃粉</button>
      <button class="chip" data-t="不辣">不辣</button>
      <button class="chip" data-t="微辣">微辣</button>
      <button class="chip" data-t="想吃辣的">想吃辣的</button>
      <button class="chip" data-t="十块以内">十块以内</button>
      <button class="chip" data-t="随便">随便</button>
    </div>

    <div class="row">
      <button class="go" id="go">帮我选</button>
      <span class="tag">不满意就再点一次，每次都不一样</span>
    </div>
  </div>

  <div id="out"></div>

  <footer>这是我的第一个网页 · <a href="about.html">旧版本</a></footer>

<script>
/* ============================================================
   这个页面怎么工作的：
   1. 你输入一句话，页面把它发给后端
   2. 后端拿着「学校菜单 + 你的话」去问大模型
   3. 大模型从菜单里挑 3 个，页面画出来

   为什么 Key 不在这个文件里？
   因为这个文件的每一行，任何人按 F12 都能看到。
   Key 只能放在后端，那是别人看不见的地方。
   ============================================================ */

const BACKEND = 'https://parts-wyoming-satisfactory-tile.trycloudflare.com';

const $q = document.getElementById('q');
const $go = document.getElementById('go');
const $out = document.getElementById('out');

// 点标签 = 往输入框里加一句话，不覆盖你已经打的字
document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    const t = c.dataset.t;
    $q.value = $q.value.trim() ? $q.value.trim() + '，' + t : t;
    $q.focus();
  };
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

function render(picks, note) {
  if (!picks || !picks.length) {
    $out.innerHTML = '<div class="empty">没找到合适的，换个说法再试一次？</div>';
    return;
  }
  const noteHtml = note ? '<div class="note">' + esc(note) + '</div>' : '';
  $out.innerHTML = noteHtml + picks.map(p => {
    return '<div class="card">'
      + '<div class="shop">' + esc(p.shop || '') + '</div>'
      + '<div class="dish">' + esc(p.dish || '')
      + '<span class="price"><span>¥</span>' + esc(p.price == null ? '?' : p.price) + '</span>'
      + '<span class="meta">' + esc(p.spicy || '') + '</span>'
      + '</div>'
      + '<p class="why">' + esc(p.why || '') + '</p>'
      + '</div>';
  }).join('');
}

$go.onclick = async () => {
  const text = $q.value.trim();
  if (!text) { $q.focus(); return; }

  $go.disabled = true;
  $out.innerHTML = '<div class="empty">正在挑…</div>';
  $out.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch(BACKEND + '/api/pick', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data.picks, data.note);
  } catch (e) {
    render([], '');
    $out.innerHTML = '<div class="note">连不上后端（AI 在你电脑上，电脑关了或者隧道断了）。'
      + '等一会儿再点一次。</div>';
  } finally {
    $go.disabled = false;
  }
};

// Ctrl/Cmd + Enter 直接提交
$q.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $go.click();
});

/* ============================================================
   右上角的「随机」按钮
   ------------------------------------------------------------
   和「帮我选」完全不同：这里不花 AI 的钱，也不看你想吃什么，
   直接从整份菜单里闭眼抽一道。

   先把菜单要下来缓存住（几千道也不大），之后每次点就是本地
   抽一次，所以是「秒出」，连点十次也不心疼。
   ============================================================ */
const $dice = document.getElementById('dice');
let MENU_CACHE = null;

async function getMenu() {
  if (MENU_CACHE) return MENU_CACHE;
  const res = await fetch(BACKEND + '/api/menu');
  const data = await res.json();
  MENU_CACHE = data.shops || [];
  return MENU_CACHE;
}

function luckyPick(shops) {
  // 先随机挑一家店，再从这家店的菜里随机挑一道。
  // 这样不会因为某家店菜多就一直抽到它。
  const shop = shops[Math.floor(Math.random() * shops.length)];
  const dish = shop.dishes[Math.floor(Math.random() * shop.dishes.length)];
  const yes = ['就它了', '今天吃这个', '别犹豫了', '天意', '抽到就是缘分'];
  return {
    shop: shop.name,
    dish: dish.name,
    price: dish.price,
    spicy: ['不辣', '微辣', '中辣', '特辣'][Math.min(dish.spicy || 0, 3)],
    why: yes[Math.floor(Math.random() * yes.length)] + '，别再纠结了。'
  };
}

function renderLucky(one) {
  document.getElementById('m-shop').textContent = one.shop;
  document.getElementById('m-dish').textContent = one.dish;
  document.getElementById('m-price').innerHTML = '<span>¥</span>' + esc(one.price);
  document.getElementById('m-spicy').textContent = one.spicy;
  document.getElementById('m-why').textContent = one.why;
}

const $mask = document.getElementById('mask');

function openModal(one) {
  renderLucky(one);
  $mask.classList.add('show');
  $mask.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  $mask.classList.remove('show');
  $mask.setAttribute('aria-hidden', 'true');
}

// 点遮罩空白处 = 关掉（但点到卡片里面不关）
$mask.onclick = e => { if (e.target === $mask) closeModal(); };
// Esc 也能关
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $mask.classList.contains('show')) closeModal();
});
document.getElementById('m-close').onclick = closeModal;
document.getElementById('m-again').onclick = () => roll();

async function roll() {
  $dice.disabled = true;
  $dice.classList.remove('rolling');
  void $dice.offsetWidth;      // 强制重排，让动画能重播
  $dice.classList.add('rolling');

  try {
    const shops = await getMenu();
    if (!shops.length) throw new Error('菜单是空的');
    // 停顿一下，让「摇」这个动作有手感
    await new Promise(r => setTimeout(r, 420));
    openModal(luckyPick(shops));
  } catch (e) {
    closeModal();
    $out.innerHTML = '<div class="note">连不上后端，抽不了。等会儿再试。</div>';
  } finally {
    $dice.disabled = false;
  }
}

$dice.onclick = roll;

</script>
</body>
</html>
