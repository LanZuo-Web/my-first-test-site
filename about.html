<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: #6b7280;
      margin: 0 0 28px;
      line-height: 1.7;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px 26px;
      text-align: left;
      box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.18);
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 14px;
      color: #111827;
    }
    .card ul {
      margin: 0;
      padding-left: 20px;
      line-height: 2;
      color: #374151;
      font-size: 0.95rem;
    }
    .tip {
      margin-top: 26px;
      font-size: 0.85rem;
      color: #9ca3af;
      line-height: 1.7;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #4338ca;
      margin-bottom: 18px;
    }
    #greet {
      margin: 0 0 16px;
      line-height: 1.8;
      color: #374151;
      font-size: 0.95rem;
    }
    button.act {
      padding: 10px 22px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }
    button.act:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main>
    <div class="badge">v0.2 · 已上线</div>
    <h1>你好，我是 岚佐 👋</h1>
    <p class="sub">这是我写的第一个网页。<br>它已经在互联网上了，谁都能打开。</p>

    <div class="card">
      <h2>关于我</h2>
      <ul>
        <li>正在学：AI 全栈开发</li>
        <li>今天完成了：写好第一个网页、推进 GitHub、发布上线</li>
        <li>下一步：让它会说话，然后连上 AI</li>
      </ul>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>让它动起来</h2>
      <p id="greet">现在这个网页是死的，点一下按钮试试。</p>
      <button class="act" onclick="sayHi()">点我</button>
    </div>

    <p class="tip">试着把上面的文字改掉、保存、刷新浏览器 —— 你会立刻看到变化。<br>这就是网页开发最原始的快感。</p>
  </main>

  <script>
    // 数组：一个装了很多句话的盒子
    const hellos = [
      "今天也要加油",
      "你比昨天更会写代码了",
      "这个页面已经会说话了",
      "下一步，我们让它连上 AI"
    ];

    // 函数：点按钮的时候被叫起来执行
    function sayHi() {
      const i = Math.floor(Math.random() * hellos.length); // 随机挑一句
      const time = new Date().toLocaleTimeString();        // 取当前时间
      document.getElementById("greet").textContent = hellos[i] + " —— " + time;
    }
  </script>
</body>
</html>
